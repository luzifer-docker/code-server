name: docker-publish

on:
  push: {}

permissions:
  contents: write
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: luzifer/actions/docker-publish@543959a4a97b64ad302d8bbcf07f46a3036e1e1d # develop
        with:
          image: ghcr.io/luzifer-docker/code-server
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
