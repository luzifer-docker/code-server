name: docker-publish

on:
  push: {}

permissions:
  contents: write
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: luzifer/actions/docker-publish@207fd028b122b60f8218cbfff0cb7401d55f29a1 # develop
        with:
          image: ghcr.io/luzifer-docker/code-server
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
